  abstract: A sample of over 25,000 fully measured neutrino and antineutrino charged current interactions
    in BEBC includes 192 dilepton candidates. The prompt signal after subtraction of background is 41
    ±7µ+e-, 35±7µ+µ- events from\(\bar v\) interactions, and 32±7µ-µ+ events from ν interactions. There
    are 2 trileptons, µ-µ-e+ and µ-µ-µ+. Results are compared with other experimental data and with the
    standard model. Limits to prompt like sign µ+e+, µ+µ+ and µ-µ- signals are given and compared with
    other experiments and with theoretical calculations.
