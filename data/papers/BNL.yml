- bibtag: Kitagaki:1990vs
  title: Study of neutrino d ---> mu- p p(s) and neutrino d ---> mu- Delta++ (1232) n(s) using the BNL 7-foot deuterium
    filled bubble chamber
  collaboration: BNL
  arxiv: null
  doi: 10.1103/PhysRevD.42.1331
  journal: Phys.Rev.D
  volume: '42'
  pages: '1331'
  year: 1990
  published_date: '1990'
  inspire_recid: 304880
  citation_count: 212
  release_status: not_xsec
  abstract: The weak nucleon axial-vector ($F_A$) and vector ($F_V$) form factors are determined
    from the momentum-transfer-squared ($Q^2$) distributions using 2538 $\mu^- p$ and 1384
    $\mu^-\Delta^{++}$ events. The data were obtained from 1 800 000 pictures taken in the BNL
    7-foot deuterium-filled bubble chamber exposed to a wide-band neutrino beam with a mean energy
    $E_\nu=1.6$ GeV. In the framework of the conventional $V-A$ theory with standard assumptions,
    the value obtained from the $\mu^- p$ events for the axial-vector mass $M_A$ in the pure
    dipole parameterization is $1.070^{+0.040}_{-0.045}$ GeV and from the $\mu^-\Delta^{++}$
    events is $1.28^{+0.08}_{-0.10}$ GeV. These results are in good agreement with an earlier
    measurement from this experiment and other recent results. The reaction mechanisms for both
    processes are compared and found to be very similar. A two-parameter fit for the quasielastic
    reaction, using dipole forms for $F_V$ and $F_A$ yields $M_A=0.97^{+0.14}_{-0.11}$ GeV and
    $M_V=0.89^{+0.04}_{-0.07}$ GeV, which is in good agreement with the conserved-vector-current
    value of $M_V=0.84$ GeV. Possible deviations from the standard assumptions are also discussed.
  added: '2026-07-23'
  notes: Added after cross-referencing the Formaggio-Zeller review (1305.7513) and the Wilkinson ANL/BNL reanalysis
    (1411.4482).
  links:
