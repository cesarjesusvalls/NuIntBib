  abstract: The cross section of the quasi-elastic reactions\(\bar v_\mup \to \mu ^ +\Lambda (\Sigma ^0
    )\) in the energy range 5–100 GeV is determined from Fermilab 15′ bubble chamber antineutrino data.
    TheQ2 analysis of quasi-elastic Λ events yieldsMA=1.0±0.3 GeV/c2 for the axial mass value. With zero
    µΛK0 events observed, the 90% confidence level upper limit\(\sigma (\bar v_\mup \to \mu ^ +\Lambda
    {\rm K}^0 )< 2.0 \cdot 10^{ - 40} cm^2 \) is obtained. At the same time, we found that the cross section
    of reaction\(\bar v_\mup \to \mu ^ +\Lambda {\rm K}^0+ m\pi ^0 \) is equal to\(\left( {3.9\begin{array}{*{20}c}{
    + 1.6}\\{ - 1.3}\\ \end{array} } \right) \cdot 10^{ - 40} cm^2 \).
