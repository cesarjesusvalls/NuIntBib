  inspire_recid: 11160
  citation_count: 19
  abstract: We have studied the semi-inclusive reactions ν¯p→μ+V0X and νp→μ−V0X, and measured the fractional
    rate for producing one or more neutral strange particles in these reactions to be 0.16±0.03 and 0.15±0.04,
    respectively. We have observed K−(892) and Σ−(1385) production in ν¯p scattering at a few percent
    of the inclusive rate. No evidence for D0 production was seen in the KS0π+π− final state. The distributions
    in the standard deep-inelastic kinematic variables are presented for events with strange particles
    and compared to those for the other charged-current data. The fragmentation properties of events containing
    a KS0 are in agreement with results from electroproduction experiments, and we have measured ∫0.31.0(1NT)(dNdz)dz=0.029±0.005,
    which is smaller than the prediction of the Field and Feynman fragmentation model.
