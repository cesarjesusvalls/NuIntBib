- bibtag: BEBCWA21:1986pvd
  title: Measurement of Total Cross-sections for Neutrino and Anti-neutrino Charged Current Interactions
    in Hydrogen and Neon
  collaboration: BEBC
  arxiv: null
  doi: 10.1016/0370-2693(86)90248-0
  journal: Phys.Lett.B
  volume: '173'
  pages: '211'
  year: 1986
  published_date: 1986-03
  inspire_recid: 227412
  citation_count: 31
  abstract: BEBC filled in turn with hydrogen, and with a neon-hydrogen mixture, was exposed to the CERN
    SPS wide band neutrino and antineutrino beams. The ratios of the charged-current cross sections per
    nucleon, $\sigma(\nu\mathrm{H}_2)/\sigma(\nu\mathrm{Ne})$ and $\sigma(\bar\nu\mathrm{H}_2)/\sigma(\bar\nu\mathrm{Ne})$,
    between 20 and 300 GeV were found to be $0.656\pm0.020$ and $1.425\pm0.052$, respectively. Multiplying
    these ratios by the revised cross sections in neon, $\sigma(\nu\mathrm{Ne})/E = (0.723\pm0.038)\times10^{-38}$
    cm$^2$/GeV per nucleon and $\sigma(\bar\nu\mathrm{Ne})/E = (0.351\pm0.019)\times10^{-38}$ cm$^2$/GeV
    per nucleon, and their ratio, $\sigma(\bar\nu\mathrm{Ne})/\sigma(\nu\mathrm{Ne}) = 0.485\pm0.020$,
    yields values for the total charged-current cross sections on protons, $\sigma(\nu p)/E$ and $\sigma(\bar\nu
    p)/E$, of $(0.474\pm0.029)\times10^{-38}$ cm$^2$/GeV and $(0.500\pm0.032)\times10^{-38}$ cm$^2$/GeV,
    respectively, and a value for the ratio $\sigma(\bar\nu p)/\sigma(\nu p)$ of $1.053\pm0.066$.
