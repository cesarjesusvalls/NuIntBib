- bibtag: NuTeV:2001dfo
  title: Precise Measurement of Dimuon Production Cross-Sections in $\nu_{\mu}$ Fe and $\bar{\nu}_{\mu}$
    Fe Deep Inelastic Scattering at the Tevatron.
  collaboration: NuTeV
  arxiv: hep-ex/0102049
  doi: 10.1103/PhysRevD.64.112006
  journal: Phys.Rev.D
  volume: '64'
  pages: '112006'
  year: 2001
  published_date: 2001-02
  inspire_recid: 553499
  citation_count: 425
  abstract: We present measurements of the semi-inclusive cross sections for νμ- and ν¯μ-nucleon deep
    inelastic scattering interactions with two oppositely charged muons in the final state. These events
    dominantly arise from the production of a charm quark during the scattering process. The measurement
    was obtained from the analysis of 5102 νμ-induced and 1458 ν¯μ-induced events collected with the NuTeV
    detector exposed to a sign-selected beam at the Fermilab Tevatron. We also extract a cross-section
    measurement from a reanalysis of 5030 νμ-induced and 1060 ν¯μ-induced events collected from the exposure
    of the same detector to a quad-triplet beam by the Chicago Columbia Fermilab Rochester (CCFR) experiment.
    The results are combined to obtain the most statistically precise measurement of neutrino-induced
    dimuon production cross sections to date. These measurements should be of broad use to phenomenologists
    interested in the dynamics of charm production, the strangeness content of the nucleon, and the Cabibbo-Kobayashi-Maskawa
    matrix element Vcd.
  added: '2026-08-21'
  notes: Charm/dimuon production (FZ audit, added 2026-08).
  links:
    arxiv: https://arxiv.org/abs/hep-ex/0102049
    doi: https://doi.org/10.1103/PhysRevD.64.112006
    inspire: https://inspirehep.net/literature?q=texkeys.raw:NuTeV:2001dfo
  measurements:
