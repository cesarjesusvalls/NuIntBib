  abstract: Charmed hadron production has been studied using a hybrid emulsion spectrometer in the Fermilab
    wide-band neutrino beam. The relative rates of D 0 , D + , F + , and Λ + c production have been measured
    - the fraction of D mesons is 69 ± 8 10 % . Momentum, transverse momentum, Feynman X , and fragmentation
    ( Z ) distributions are presented. The mean Z for charmed hadrons is 0.59 ± 0.03 (±0.03). Charmed
    target fragments have been observed.
