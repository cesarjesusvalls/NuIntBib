- bibtag: Distel:2002ch
  title: Measurement of the cross-section for the reaction I-127 (nu(e), e-) Xe-127(bound states) with
    neutrinos from the decay of stopped muons
  collaboration: LAMPF
  arxiv: nucl-ex/0208012
  doi: 10.1103/PhysRevC.68.054613
  journal: Phys.Rev.C
  volume: '68'
  pages: '054613'
  year: 2002
  published_date: 2002-08
  inspire_recid: 593436
  citation_count: 25
  release_status: abstract
  abstract: The cross section for the reaction 127I(neutrino,electron)127Xe_(bound states) has been measured
    for electron neutrinos from the decay of stopped muons to be [2.84 +/- 0.91 (stat) +/- 0.25 (syst)]
    x 10^(-40) cm^2. A tank containing 1540 kg of 127I in the form of NaI solution was placed 8.53 m from
    the LAMPF beamstop where it received a typical flux of 5 x 10^7 neutrinos/(cm^2 s). The 127Xe atoms
    produced by neutrino capture were extracted from the target solution, placed in miniature proportional
    counters, and their number was determined by counting. This is the first measurement of a neutrino
    capture cross section for an I nucleus and is in good agreement with a recent calculation.
  added: '2026-08-07'
  notes: Low-energy decay-at-rest ν–127I (FZ audit, added 2026-08).
