- bibtag: Allen:1985ti
  title: A Study of Single Meson Production in Neutrino and Anti-neutrinos Charged Current Interactions
    on Protons
  collaboration: BEBC
  arxiv: null
  doi: 10.1016/0550-3213(86)90480-3
  journal: Nucl.Phys.B
  volume: '264'
  pages: '221'
  year: 1986
  published_date: '1986'
  inspire_recid: 213386
  citation_count: 85
  abstract: We present results on exclusive single-charged pion and kaon production in neutrino and antineutrino
    interactions on protons in the energy range from 5 to 120 GeV. The data were obtained from exposures
    of BEBC to wide band beams at the CERN SPS. For invariant masses of the $(p\pi)$ system below 2 GeV,
    the pions originate predominantly from decays of baryon resonances excited by the weak charged current.
    Similarly, we observe the production of $\Lambda(1520)$ decaying into $p$ and $K^-$. For invariant
    masses above 2 GeV pion production becomes peripheral by interaction of the weak current with a virtual
    $\pi^0$. We establish a contribution of longitudinally polarised intermediate vector bosons to this
    process.
  added: '2026-07-23'
  notes: Added after cross-referencing the Formaggio-Zeller review (1305.7513) and the Wilkinson ANL/BNL
    reanalysis (1411.4482).
