  abstract: Neutral strange particle production in\(\bar v\) Ne charged current interactions is studied
    using the bubble chamber BEBC, exposed to the CERN SPS antineutrino wide band beam. From a sample
    of 1191 neutral strange particles, the inclusive production rates are determined to be (15.7±0.8)%
    forK0 mesons, (8.2±0.5)% for Λ, (0.4±0.2)% for\(\bar \Lambda \) and (0.6±0.3)% for Σ0 hyperons. The
    inclusive production properties ofK0 mesons and Λ hyperons are investigated. The Λ hyperons are found
    to be polarized in the production plane.
