  abstract_tex: The neutrino-induced nuclear transition $^{12}\mathrm{C}$($\nu_e$,$e^-$)$^{12}\mathrm{N}$
    (g.s.) has been observed with a 15-ton fine-grained tracking detector. The exclusive final state is
    identified by both an electron track and the positron decay of the $^{12}\mathrm{N}$. From the observation
    of 181±17 $^{12}\mathrm{C}$($\nu_e$,$e^-$)$^{12}\mathrm{N}$ (g.s.) events with subsequent positron
    decays the flux-averaged cross section, equivalent to the cross section for 35.0-MeV neutrinos, is
    [1.05±0.10(stat)±0.10(syst)]$\times 10^{-41}$ $\mathrm{cm}^2$. This result is in good agreement with
    recent calculations.
