  abstract: Three charmed-baryon candidates produced in the quasielastic reaction νn→μ−Λc+→μ−Λπ+ were
    found in an exposure of the Fermilab deuterium-filled 15-ft bubble chamber to a wide-band neutrino
    beam. We also found that the cross section of the associated-production reaction νn→μ−ΛK+ is (5.5±1.3±1.1)
