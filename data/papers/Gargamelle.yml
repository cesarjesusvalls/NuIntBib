- bibtag: Haatuft:1983it
  title: Dilepton and Trilepton Production by Neutrinos in Gargamelle at {CERN} {SPS} Energies
  collaboration: Gargamelle
  arxiv: null
  doi: 10.1016/0550-3213(83)90539-4
  journal: Nucl.Phys.B
  volume: '222'
  pages: '365'
  year: 1983
  published_date: 1983-01
  inspire_recid: 189031
  citation_count: 31
  abstract: We report on a search for ν μ N → μ − e − X and ν μ N → μ − e + e − X events in Gargamelle
    at CERN Super Proton Synchrotron (SPS) energies. Ten μ − e − events were found with p e − > 0.5 GeV/
    c and p μ − > 4.5 GeV/ c (seven of these events have p e − > 0.8 GeV/ c ). The rate relative to the
    charged-current events is (6.7 ± 3.9) × 10 −4 , and to the opposite-sign dileptons 0.20 ± 0.11. Some
    characteristics of the μ − e − events are compared with μ − e + and charged-current events. Three
    ν μ N → μ − e + e − X events were observed with p e ± > 0.3 GeV/ c , p μ − > 4.5 GeV/ c , and m e
    + e − > m π 0 . The rate of these events relative to the charged-current events is (3.1 ± 1.9) × 10
    −4 .
