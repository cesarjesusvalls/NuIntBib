  citation_count: 30
  abstract: The production of the neutral strange particlesK0, Λ and\(\bar \Lambda \) invp and\(\bar vp\)
    charged current interactions is studied in an experiment with the Big European Bubble Chamber. Mean
    multiplicities are measured as a function of the event variablesEv,W2 andQ2 and of the hadron variablesxF,z
    andpT2.K*± (892) and∑*± (1385) signals are observed, whereas there is no evidence for∑*- (1385) production
    invp scattering. Forward, backward and total mean multiplicities are found to compare well with the
    predictions of an empirical model for deep-inelastic reactions in the case of the strange mesonsK0
    andK*± (892) but less so for the strange baryons Λ,\(\bar \Lambda \) and∑*± (1385). The strange baryon
    multiplicities are used to obtain the decuplet to octet baryon production ratio and to assess the
    probabilities of auu orud system to break up.
