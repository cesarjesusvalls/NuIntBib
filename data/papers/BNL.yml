- bibtag: Baker:1982ty
  title: Total Cross-sections for Muon-neutrino $N$ and Muon-neutrino $P$ Charged Current Interactions in the 7-ft
    Bubble Chamber
  collaboration: BNL
  arxiv: null
  doi: 10.1103/PhysRevD.25.617
  journal: Phys.Rev.D
  volume: '25'
  pages: '617'
  year: 1982
  published_date: '1982'
  inspire_recid: 177607
  citation_count: 136
  abstract: The total cross sections for $\nu_\mu n$ and $\nu_\mu p$ charged-current interactions
    and their ratio $R=\sigma_T(\nu n)/\sigma_T(\nu p)$ have been measured as a function of
    neutrino energy from 0.4 to 10 GeV. The experiment is performed using the BNL 7-foot deuterium
    bubble chamber exposed to the Alternating Gradient Synchrotron wide-band neutrino beam. The
    absolute values of the cross sections are normalized to the quasielastic scattering ($\nu_\mu
    n\to\mu^- p$) cross section. Above 1.6 GeV the data are consistent with the quark-parton
    model. We find that $\sigma_T(\nu n)/E_\nu=(1.07\pm0.05)\times10^{-38}$, $\sigma_T(\nu
    p)/E_\nu=(0.54\pm0.04)\times10^{-38}$, and $\sigma_T(\nu N)/E_\nu=(0.80\pm0.03)\times10^{-38}$
    cm$^2$/GeV for $\langle E_\nu\rangle=3.2$ GeV, and $R=1.95\pm0.10$ for $\langle
    E_\nu\rangle=3.7$ GeV.
  added: '2026-07-23'
  notes: Added after cross-referencing the Formaggio-Zeller review (1305.7513) and the Wilkinson ANL/BNL reanalysis
    (1411.4482).
