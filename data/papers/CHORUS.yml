  abstract_tex: After completion of the data taking for the $\nu_\mu$ $\to$ $\nu_\tau$ oscillation search,
    the CHORUS lead-scintillator calorimeter was used in the 1998 run as an active target. High-statistics
    samples of charged-current interactions were collected in the CERN SPS west area neutrino beam. This
    beam contained predominantly muon (anti-)neutrinos from sign-selected pions and kaons. We measure
    the flux and energy spectrum of the incident neutrinos and compare them with beam simulations. The
    neutrino-nucleon and anti-neutrino-nucleon differential cross-sections are measured in the range 0.01<x<0.7
    , 0.05<y<0.95 , 10<Eν<200 GeV . We extract the neutrino-nucleon structure functions $^{2}\mathrm{F}$(x,Q2)
    , xF3(x,Q2) , and R(x,Q2) and compare these with results from other experiments.
- bibtag: CHORUS:2005mof
  title: Measurements of D0 production and of decay branching fractions in neutrino nucleon scattering
  collaboration: CHORUS
  arxiv: null
  doi: 10.1016/j.j.physletb.2005.03.036
  journal: Phys.Lett.B
  volume: '613'
  pages: '105'
  year: 2005
  published_date: 2005-03
  inspire_recid: 680505
  citation_count: 32
  abstract: During the years 1994–1997, the emulsion target of the CHORUS detector was exposed to the
    wide-band neutrino beam of the CERN SPS of 27 GeV average neutrino energy. In total about 100 000
    charged-current neutrino interactions were located in the nuclear emulsion target and fully reconstructed.
    From this sample of events which was based on the data acquired by new automatic scanning systems,
    1048 charged-current interactions with a D0 in the final state were selected by a pattern recognition
    program and confirmed as neutral-particle decays through visual inspection. The ratio of decay branching
    fractions of the D0 into four charged particles to two charged particles was measured to be B(D0→V4)/B(D0→V2)=0.207±0.016±0.004
    . The inclusive measurement of the observed production rate of the D0 with a decay into four charged
    prongs in combination with external measurements of this topological branching ratio was used to determine
    the total D0 production rate by neutrinos without additional assumption on the branching fractions.
    The value of this rate relative to the charged-current cross-section was found to be σ(D0)/σ(CC)=0.0269±0.0018±0.0013
    . In addition, the same normalization method was used to deduce the inclusive topological decay rate
    into final states with neutral particles only. A value of 0.218±0.049±0.036 was found for this branching
    fraction. From an observed number of three charged six-prong events the branching ratio into six charged
    particles was determined to be (1.2−0.9+1.3±0.2)×10−3 . A measurement of the energy dependence of
    the D0 production by neutrinos relative to the total charged-current cross-section is also reported.
    This measurement was used to deduce for mc , the effective charm-quark mass, a value of (1.42±0.08)GeV/c2
    .
