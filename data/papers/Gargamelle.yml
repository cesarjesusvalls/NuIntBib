  release_status: abstract
  abstract_tex: We report on a search for $\nu_\mu$ N $\to$ $\mu^-$ e - X and $\nu_\mu$ N $\to$ $\mu^-$
    e + e - X events in Gargamelle at CERN Super Proton Synchrotron (SPS) energies. Ten $\mu^-$ e - events
    were found with p e - > 0.5 GeV/ c and p $\mu^-$ > 4.5 GeV/ c (seven of these events have p e - >
    0.8 GeV/ c ). The rate relative to the charged-current events is (6.7 ± 3.9) $\times 10^{-4}$ , and
    to the opposite-sign dileptons 0.20 ± 0.11. Some characteristics of the $\mu^-$ e - events are compared
    with $\mu^-$ e + and charged-current events. Three $\nu_\mu$ N $\to$ $\mu^-$ e + e - X events were
    observed with p e ± > 0.3 GeV/ c , p $\mu^-$ > 4.5 GeV/ c , and m e + e - > m π 0 . The rate of these
    events relative to the charged-current events is (3.1 ± 1.9) $\times 10^{-4}$ .
