  citation_count: 224
  abstract: In addition to one previously reported event, a second event, in which a positron is observed
    together with a strange particle and a negative muon, has been seen in the bubble chamber Gargamelle
    exposed to the CERN neutrino beam. The level of the background for this type of event is found to
    be very low. The data strongly indicate the existence of a new type of interaction leading to a charged
    lepton pair correlated with a strange particle in the final state. The interpretation of these two
    events in terms of production of a charmed hadron is presented.
