  abstract_tex: The cross section for the reaction $^{127}\mathrm{I}$(neutrino,electron)$^{127}\mathrm{Xe}$_(bound
    states) has been measured for electron neutrinos from the decay of stopped muons to be [2.84 +/- 0.91
    (stat) +/- 0.25 (syst)] x $10^{-40}$ $\mathrm{cm}^2$. A tank containing 1540 kg of $^{127}\mathrm{I}$
    in the form of NaI solution was placed 8.53 m from the LAMPF beamstop where it received a typical
    flux of 5 x $10^{7}$ neutrinos/($\mathrm{cm}^2$ s). The $^{127}\mathrm{Xe}$ atoms produced by neutrino
    capture were extracted from the target solution, placed in miniature proportional counters, and their
    number was determined by counting. This is the first measurement of a neutrino capture cross section
    for an I nucleus and is in good agreement with a recent calculation.
- bibtag: Willis:1980pj
  title: A Neutrino Experiment to Test the Nature of Muon Number Conservation
  collaboration: LAMPF
  arxiv: null
  doi: 10.1103/PhysRevLett.44.522
  journal: Phys.Rev.Lett.
  volume: '44'
  pages: '522'
  year: 1980
  published_date: 1980-01
  inspire_recid: 8773
  citation_count: 132
  release_status: abstract
  abstract: This paper reports on a search for ν¯e from μ+→e+ν¯eνμ, allowed by multiplicative but not
    additive muon conservation, and for νe from μ+→e+νeν¯μ, allowed by both. Neutrinos from the Clinton
    P. Anderson Meson Physics Facility have been used, together with a six-ton Cherenkov counter filled
    with H2O (D2O) to look for νep→ne+(νed→ppe−). The branching ratio (μ+→e+νeνμ)(μ+→all)=−0.001±0.040
    is in excellent agreement with the additive law. The cross section 〈σ(νed→ppe−)〉=(0.52±0.18)×10−40
    cm2 agrees with theory.
  added: '2026-08-07'
  notes: Decay-at-rest ν–deuteron dissociation (FZ audit, added 2026-08).
