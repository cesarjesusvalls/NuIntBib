- bibtag: Mishra:1990yf
  title: Inverse Muon Decay, $\nu_\mu e \to \mu^- \nu_e$, at the Fermilab Tevatron
  collaboration: CCFR
  arxiv: null
  doi: 10.1016/0370-2693(90)91099-W
  journal: Phys.Lett.B
  volume: '252'
  pages: '170'
  year: 1990
  published_date: 1990-05
  inspire_recid: 296115
  citation_count: 54
  release_status: abstract
  abstract: We report an improved measurement of the inverse muon decay process, ν μ +e→ μ − + ν e , at
    the Fermilab Tevatron. The rate of this reaction with respect to the ν μ -N charged current interaction
    is measured to be (0.1245±0.0057(stat.)±0.0031 (sys.)) × 10 −2 . The measurement confirms the standard
    model predictions for the Lorentz structure of the weak current, the helicity of the neutrino, and
    the energy dependence of the cross section.
