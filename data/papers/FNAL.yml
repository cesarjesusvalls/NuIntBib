  abstract: We present results for the reactions $\nu p\to\mu^-\pi^+ p$ and $\nu p\to\mu^- K^+ p$ at energies
    above 5 GeV. The average cross section for the first reaction between 15 and 40 GeV is $(0.80\pm0.12)\times10^{-38}$
    cm$^2$ and for events with $M_{\pi^+ p}<1.4$ GeV is $(0.55\pm0.08)\times10^{-38}$ cm$^2$. The ratio
    of the cross section for the second reaction to that for the first is $0.017\pm0.010$.
