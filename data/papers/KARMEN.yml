    target:
    - C
    topology: Inclusive
    pion_bucket: null
    measurement_type: total
    observables: NC 12C(νμ,νμ')12C*(15.1 MeV) cross section (3.2e-42), monoenergetic νμ
    energy_notes: π+ decay-at-rest νμ (29.8 MeV)
- bibtag: KARMEN:1992nka
  title: Cross-section of the charged current reaction C-12 (electron-neutrino e-) N-12 (g.s.).
  collaboration: KARMEN
  arxiv: null
  doi: 10.1016/0370-2693(92)90055-9
  journal: Phys.Lett.B
  volume: '280'
  pages: '198'
  year: 1992
  published_date: '1992'
  inspire_recid: 339317
  citation_count: 70
  release_status: abstract
  abstract: The charged current nuclear transition 12 C(v e , e − ) 12 N g.s. has been observed in the
    KARMEN experiment. The flux average cross section for v e from μ + decay at rest is determined to
    be 〈 σ 〉 = [8.1±0.9(stat.)±0.75 (syst.)]×10 −42 cm 2 . For the first time also the energy dependence
    of the cross section has been measured for neutrino energies up to 50 MeV.
  added: '2026-08-07'
  notes: Low-energy decay-at-rest ν–12C (FZ audit, added 2026-08).
  links:
    arxiv: null
    doi: https://doi.org/10.1016/0370-2693(92)90055-9
