- bibtag: Berge:1978fy
  title: Inclusive Neutral Strange Particle Production from High-Energy Neutrino p Charged Current Interactions
  collaboration: FNAL
  arxiv: null
  doi: 10.1103/PhysRevD.18.1359
  journal: Phys.Rev.D
  volume: '18'
  pages: '1359'
  year: 1978
  published_date: 1978-03
  inspire_recid: 130087
  citation_count: 32
  abstract: We have studied the properties of inclusive neutral-strange-particle production in charged-current
    νp interactions. The relative rate for producing at least one neutral strange particle in a charged-current
    interaction is 0.14 ± 0.02. The inclusive distributions for events with neutral strange particles
    and for all charged-current events exhibit the same qualitative behavior. We find no acceptable candidates
    for the ΔS=−ΔQ  Λ production reaction νp→μ−Λ3π+π− in approximately 3000 charged-current events with
    Eν>10 GeV. We find upper limits (relative to the total charged-current sample) for charmed-particle
    production in any one mass region with subsequent decay into Λmπ and Kmπ final states of 1% and 2%,
    respectively.
