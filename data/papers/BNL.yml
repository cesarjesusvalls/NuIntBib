  title: STUDY OF THE ISOSPIN STRUCTURE OF SINGLE PION PRODUCTION IN CHARGED CURRENT NEUTRINO INTERACTIONS
  abstract: The isospin structure of weak single-pion production in the reactions νp→μ−pπ+, νn→μ−pπ0,
    and νn→μ−nπ+ has been studied using the 7-foot deuterium bubble chamber exposed to a wide-band neutrino
    beam at BNL. We find that the I=12Nπ amplitude is substantial even in the Δ(1232) mass region and
    the relative phase angle ψ is approximately 90° as predicted by the Adler model.
