- bibtag: Ahrens:1986xe
  title: Measurement of Neutrino - Proton and anti-neutrino - Proton Elastic Scattering
  collaboration: BNL
  arxiv: null
  doi: 10.1103/PhysRevD.35.785
  journal: Phys.Rev.D
  volume: '35'
  pages: '785'
  year: 1987
  published_date: '1987'
  inspire_recid: 18763
  citation_count: 546
  abstract: Measurements of the semileptonic weak-neutral-current reactions $\nu_\mu p\to\nu_\mu
    p$ and $\bar\nu_\mu p\to\bar\nu_\mu p$ are presented. The experiment was performed using a
    170-metric-ton high-resolution target detector in the BNL wide-band neutrino beam.
    High-statistics samples yield the absolute differential cross sections $d\sigma(\nu_\mu
    p)/dQ^2$ and $d\sigma(\bar\nu_\mu p)/dQ^2$. A measurement of the axial-vector form factor
    $G_A(Q^2)$ is also presented. The results are in good agreement with the standard model
    $SU(2)\times U(1)$. The weak-neutral-current parameter $\sin^2\theta_W$ is determined to be
    $\sin^2\theta_W=0.220\pm0.016(\text{stat})^{+0.023}_{-0.031}(\text{syst})$.
  added: '2026-07-31'
  notes: 'Added from the Formaggio-Zeller NC-elastic thread: the BNL-E734 NC/CC ratio (~0.15) and dsigma/dQ^2 trace
    to this paper, not to the axial-mass Ahrens:1988rr.'
