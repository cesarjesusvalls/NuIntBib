  citation_count: 105
  abstract: Average total cross sections are given for neutrino charged current interactions at
    neutrino energies of 2.87 GeV and 9.05 GeV. The ratios $\langle\sigma\rangle/\langle E\rangle$
    are $0.69\pm0.05$ and $0.61\pm0.06$ in units of $10^{-38}$ cm$^2$/GeV nucleon, respectively.
    The errors include both statistical and systematic uncertainties.
