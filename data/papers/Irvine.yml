- bibtag: Riley:1998ca
  title: Neutrino induced deuteron disintegration experiment
  collaboration: Irvine
  arxiv: hep-ex/9904001
  doi: 10.1103/PhysRevC.59.1780
  journal: Phys.Rev.C
  volume: '59'
  pages: '1780'
  year: 1998
  published_date: 1998-12
  inspire_recid: 483690
  citation_count: 42
  abstract: Cross sections for the disintegration of the deuteron via neutral-current (NCD) and charged-current
    (CCD) interactions with reactor antineutrinos are measured to be 6.08 +/- 0.77 x 10^(-45) cm-sq and
    9.83 +/- 2.04 x 10^(-45) cm-sq per neutrino, respectively, in excellent agreement with current calculations.
    Since the experimental NCD value depends upon the CCD value, if we use the theoretical value for the
    CCD reaction, we obtain the improved value of 5.98 +/- 0.54 x 10^(-45) for the NCD cross section.
    The neutral-current reaction allows a unique measurement of the isovector-axial vector coupling constant
    in the hadronic weak interaction (beta). In the standard model, this constant is predicted to be exactly
    1, independent of the Weinberg angle. We measure a value of beta^2 = 1.01 +/- 0.16. Using the above
    improved value for the NCD cross section, beta^2 becomes 0.99 +/- 0.10.
  added: '2026-08-07'
  notes: Reactor ν̄e–deuteron dissociation (FZ audit, added 2026-08).
