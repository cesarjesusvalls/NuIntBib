  abstract_tex: We have measured the strange-quark content of the nucleon, ηs=-0.08+0.012, and the Kobayashi-Maskawa
    matrix element ‖Vcd‖=0.220-0.018+0.015 using a sample of 1797 $\nu_\mu$- and $\bar\nu_\mu$-induced
    $\mu^-$ $\mu^+$ events with Pμ≥9 GeV/c and 30≤Eν≤600 GeV. The data are consistent with the slow-rescaling
    hypothesis of charm production in ν-N scattering and within this formalism yield a value of the charm-quark
    mass parameter mc=1.31-0.48+0.64 GeV/c2. .AE
