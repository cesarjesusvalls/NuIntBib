  abstract: Experimental results on the study of quasielastic reactions $\nu_\mu n \to \mu^- p$
    and $\bar\nu_\mu p \to \mu^+ n$ in the energy range 3-30 GeV are presented in this paper. A
    spark chamber detector with Al filters has been exposed to the wide-band neutrino and
    antineutrino beams at Serpukhov. Neutrino and antineutrino data have been used to reconstruct
    the behaviour of the axial-vector form-factor $F_A(Q^2)$. We measured the total cross-sections
    as a function of energy. The parameter $M_A = (1.00\pm0.04)$ GeV/$c^2$ has been determined
    under the assumption of the dipole parametrization and CVC hypothesis. An upper limit for the
    second class currents was estimated.
