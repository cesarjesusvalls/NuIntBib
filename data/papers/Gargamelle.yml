  citation_count: 42
  abstract: The cross section ratio of the elastic neutral current reaction $\nu p \to \nu p$ to
    the quasi-elastic charged current reaction $\nu n \to \mu^- p$ has been measured in the
    kinematical region $0.3 \leq q^2 \leq 1.0\,(\mathrm{GeV}/c)^2$. The measured value is $R_M =
    0.17\pm0.08$. Model dependent corrections are applied, especially for $\nu n \to \nu n$
    contamination, and the result is compared to various models.
