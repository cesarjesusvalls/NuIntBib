- bibtag: NuTeV:2007uwm
  title: Measurement of the Nucleon Strange-Antistrange Asymmetry at Next-to-Leading Order in QCD from
    NuTeV Dimuon Data
  collaboration: NuTeV
  arxiv: null
  doi: 10.1103/PhysRevLett.99.192001
  journal: Phys.Rev.Lett.
  volume: '99'
  pages: '192001'
  year: 2007
  published_date: 2007-11
  inspire_recid: 774494
  citation_count: 170
  abstract: We present a new measurement of the difference between the nucleon strange and antistrange
    quark distributions from dimuon events recorded by the NuTeV experiment at Fermilab. This analysis
    is the first to use a complete next to leading order QCD d escription of charm production from neutrino
    scattering. Dimuon events in neutrino deep inelastic scattering allow direct and independent study
    of the strange and antistrange content of the nucleon. We find a positive strange asymmetry with a
    significance of 1.6sigma . We also report a new measurement of the charm mass.
