- bibtag: Fanourakis:1980si
  title: Study of Low-energy Anti-neutrino Interactions on Protons
  collaboration: BNL
  arxiv: null
  doi: 10.1103/PhysRevD.21.562
  journal: Phys.Rev.D
  volume: '21'
  pages: '562'
  year: 1980
  published_date: 1980-03
  inspire_recid: 9011
  citation_count: 70
  abstract: We present a study of antineutrino interactions in hydrogen obtained in a
    138000-picture run at the BNL 7-ft bubble chamber. The antineutrino beam had an energy
    distribution that peaked at $\sim1.1$ GeV. The cross section measured for charged-current
    interactions is $\sigma(\bar\nu
    p\to\mu^++\text{anything})=(0.32\pm0.08)\times10^{-38}\times[E_{\bar\nu}\,(\mathrm{GeV})]$
    cm$^2$. The neutral-current cross section is $\sigma(\bar\nu p\to\bar\nu
    p\pi^+\pi^-)=5.5^{+4.4}_{-2.6}\times10^{-40}$ cm$^2$. The ratio of strangeness-changing to
    non-strangeness-changing charged currents is $R_s=0.06^{+0.13}_{-0.05}$. An upper limit
    determined for charm production is $\sigma_c<3.8\times10^{-40}$ cm$^2$ at the 90% confidence
    level. From the momentum-transfer distribution we measure average $Q^2$ for inelastic
    charged-current events with energy greater than 2 GeV, $\langle
    Q^2\rangle=(0.10\pm0.03)[E_{\bar\nu}\,(\mathrm{GeV})]+(0.10\pm0.09)\,(\mathrm{GeV}/c)^2$.
    Using a maximum-likelihood method we determine from the quasielastic events $\bar\nu p\to\mu^+
    n$ an axial-vector mass $M_A=0.9^{+0.4}_{-0.3}$ GeV/$c^2$.
  added: '2026-06-16'
