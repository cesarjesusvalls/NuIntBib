- bibtag: Coteus:1981ub
  title: Measurement of Elastic Muon-neutrino and Anti-muon-neutrino Scattering on Protons
  collaboration: BNL
  arxiv: null
  doi: 10.1103/PhysRevD.24.1420
  journal: Phys.Rev.D
  volume: '24'
  pages: '1420'
  year: 1981
  published_date: '1981'
  inspire_recid: 171264
  citation_count: 15
  abstract: We have measured elastic $\nu_\mu$ and $\bar\nu_\mu$ scattering on protons at the
    Brookhaven National Laboratory Alternating Gradient Synchrotron. We find
    $R_{NC}=\sigma(\bar\nu_\mu p\to\bar\nu_\mu p)/\sigma(\nu_\mu p\to\nu_\mu p)=0.44\pm0.12$ and
    $R_{\nu_\mu}=\sigma(\nu_\mu p\to\nu_\mu p)/\sigma(\nu_\mu n\to\mu^- p)=0.11\pm0.03$. The
    elastic $Q^2$ distribution is in good agreement with present knowledge of form factors and the
    Weinberg-Salam model. We find $\sin^2\theta_W=0.26\pm0.06$.
