  abstract: We have studied the neutral-current reactions $\nu_\mu N\to\nu_\mu N'\pi^0$ and
    $\bar\nu_\mu N\to\bar\nu_\mu N'\pi^0$ and compared them to the charged-current reactions
    $\nu_\mu N\to\mu^- N''\pi^0$ and $\bar\nu_\mu N\to\mu^+ N''\pi^0$. We have measured the ratios
    $R_0'=\sigma(\nu_\mu N\to\nu_\mu N'\pi^0)/2\sigma(\nu_\mu N\to\mu^- N''\pi^0)$ and $\bar
    R_0'=\sigma(\bar\nu_\mu N\to\bar\nu_\mu N'\pi^0)/2\sigma(\bar\nu_\mu N\to\mu^+ N''\pi^0)$ to
    be $0.17\pm0.04$ and $0.39\pm0.18$, respectively. We also present the $\pi^0 p$ invariant-mass
    distribution of the neutrino-induced reactions.
