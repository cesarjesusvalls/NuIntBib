    pion_bucket: null
  release_status: digitize
  abstract_tex: We present measurements of the semi-inclusive cross sections for $\nu_\mu$- and $\bar\nu_\mu$-nucleon
    deep inelastic scattering interactions with two oppositely charged muons in the final state. These
    events dominantly arise from the production of a charm quark during the scattering process. The measurement
    was obtained from the analysis of 5102 $\nu_\mu$-induced and 1458 $\bar\nu_\mu$-induced events collected
    with the NuTeV detector exposed to a sign-selected beam at the Fermilab Tevatron. We also extract
    a cross-section measurement from a reanalysis of 5030 $\nu_\mu$-induced and 1060 $\bar\nu_\mu$-induced
    events collected from the exposure of the same detector to a quad-triplet beam by the Chicago Columbia
    Fermilab Rochester (CCFR) experiment. The results are combined to obtain the most statistically precise
    measurement of neutrino-induced dimuon production cross sections to date. These measurements should
    be of broad use to phenomenologists interested in the dynamics of charm production, the strangeness
    content of the nucleon, and the Cabibbo-Kobayashi-Maskawa matrix element Vcd.
