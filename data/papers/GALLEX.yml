- bibtag: GALLEX:1994rym
  title: First results from the Cr-51 neutrino source experiment with the GALLEX detector
  collaboration: GALLEX
  arxiv: null
  doi: 10.1016/0370-2693(94)01586-2
  journal: Phys.Lett.B
  volume: '342'
  pages: '440'
  year: 1994
  published_date: 1994-11
  inspire_recid: 380797
  citation_count: 517
  abstract: 'The radiochemical GALLEX experiment, which has been measuring the solar neutrino flux since
    May 1991, has performed an investigation with an intense man-made 51 Cr neutrino source (61.9 ± 1.2
    PBq). The source, produced via neutron irradiation of ≈ 36 kg of chromium enriched in 50 Cr, primarily
    emits 746 keV neutrinos. It was placed for a period of 3.5 months in the reentrant tube in the GALLEX
    tank, to expose the gallium chloride target to a known neutrino flux. This experiment provides the
    ratio, R , of the production rate of Cr-produced 71 Ge measured in these source exposures to the rate
    expected from the known source activity: R = 1.04 ± 0.12. This result not only constitutes the first
    observation of low-energy neutrinos from a terrestrial source, but also (a) provides an overall check
    of GALLEX, indicating that there are no significant experimental artifacts or unknown errors at the
    10% level that are comparable to the 40% deficit in observed solar neutrino signal, and (b) directly
    demonstrates for the first time, using a man-made neutrino source, the validity of the basic principles
    of radiochemical methods used to detect rare events (at the level of 10 atoms or less). Because of
    the close similarity in neutrino energy spectra from 51 Cr and from the solar 7 Be branch, this source
    experiment also shows that the gallium detector is sensitive to 7 Be neutrinos with full efficiency.'
  added: '2026-08-07'
  notes: Low-energy 71Ga radioactive-source cross section (FZ audit, added 2026-08).
