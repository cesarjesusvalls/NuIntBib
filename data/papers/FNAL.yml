- bibtag: Berge:1975bq
  title: Inclusive Strange Particle Production by Neutrino p Interactions in the 10-GeV to 200-GeV Region
  collaboration: FNAL
  arxiv: null
  doi: 10.1103/PhysRevLett.36.127
  journal: Phys.Rev.Lett.
  volume: '36'
  pages: '127'
  year: 1975
  published_date: 1975-11
  inspire_recid: 101235
  citation_count: 46
  abstract: 'Data are presented on charged-current inclusive strange-particle production in 10-200-GeV/c
    νp interactions. Final states with V0 decay topologies are reported: Ks0, Λ0(Σ0), Λ¯0(Σ¯0). Neutrino
    energy, charged multiplicity, Q2, W, x, and y distributions are shown. The corrected relative V0 production
    rate is 0.16±0.03 per event. The first example of neutrino-induced antibaryon (Λ¯) production is observed.
    The 90%-confidence upper limit on ΔS=−ΔQ inclusive Λ production is 0.036 of all charged-current νp
    interactions above 10 GeV/c.'
