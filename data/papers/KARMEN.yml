- bibtag: KARMEN:1998xmo
  title: Measurement of the weak neutral current excitation C-12(nu(mu) nu'(mu))C*-12(1+,1,15.1-MeV) at
    E(nu(mu)) = 29.8-MeV
  collaboration: KARMEN
  arxiv: null
  doi: 10.1016/S0370-2693(98)00087-2
  journal: Phys.Lett.B
  volume: '423'
  pages: '15'
  year: 1998
  published_date: '1998'
  inspire_recid: 471278
  citation_count: 82
  release_status: abstract
  abstract: The weak neutral current reaction 12 C( ν μ , ν μ ′ ) 12 C ∗ (1 + ,1; 15.1MeV) has been observed
    for the first time in the KARMEN experiment. Neutrino events were separated from background using
    two different analysis methods. The measured cross section σ NC =(3.2 ± 0.5 stat. ± 0.4 syst. ) ×
    10 −42 cm 2 for monoenergetic ν μ from π + -decay at rest is in good agreement with the standard model,
    the isovector-axialvector coupling constant of weak hadronic current deduced from this experiment
    is | β |=1.11±0.13.
  added: '2026-08-07'
  notes: Low-energy decay-at-rest ν–12C, neutral current (FZ audit, added 2026-08).
  links:
    arxiv: null
    doi: https://doi.org/10.1016/S0370-2693(98)00087-2
    inspire: https://inspirehep.net/literature?q=texkeys.raw:KARMEN:1998xmo
  measurements:
