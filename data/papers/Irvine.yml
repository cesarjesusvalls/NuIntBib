  abstract_tex: Cross sections for the disintegration of the deuteron via neutral-current (NCD) and charged-current
    (CCD) interactions with reactor antineutrinos are measured to be 6.08 +/- 0.77 x $10^{-45}$ cm-sq
    and 9.83 +/- 2.04 x $10^{-45}$ cm-sq per neutrino, respectively, in excellent agreement with current
    calculations. Since the experimental NCD value depends upon the CCD value, if we use the theoretical
    value for the CCD reaction, we obtain the improved value of 5.98 +/- 0.54 x $10^{-45}$ for the NCD
    cross section. The neutral-current reaction allows a unique measurement of the isovector-axial vector
    coupling constant in the hadronic weak interaction (beta). In the standard model, this constant is
    predicted to be exactly 1, independent of the Weinberg angle. We measure a value of beta^2 = 1.01
    +/- 0.16. Using the above improved value for the NCD cross section, beta^2 becomes 0.99 +/- 0.10.
- bibtag: Pasierb:1979fb
  title: Detection of Weak Neutral Current Using Fission $\bar{\nu}_e$ on Deuterons
  collaboration: Irvine
  arxiv: null
  doi: 10.1103/PhysRevLett.43.96
  journal: Phys.Rev.Lett.
  volume: '43'
  pages: '96'
  year: 1979
  published_date: 1979-03
  inspire_recid: 140338
  citation_count: 107
  abstract: The weak-neutral-current reaction ν¯e+d→n+p+ν¯e has been observed concurrently with the charged-current
    process ν¯e+d→n+n+e+ using an instrumented D2O target exposed to an ν¯e flux of 2.5×1013 cm−2 sec−1.
    The measured neutral-current cross section, (3.8±0.9)×10−45 cm2/V¯e, is consistent with the Weinberg-Salam
    model, dependent in this case only on the axial-vector contribution. The charged-current reaction
    cross section is (1.5±0.4)×10−45 cm2/V¯e, in fair agreement with expectation.
  added: '2026-08-07'
  notes: Reactor ν̄e–deuteron dissociation, first NC observation (FZ audit, added 2026-08).
