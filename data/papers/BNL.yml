- inspire_recid: 159782
  title: Study of the Isospin Structure of Single Pion Production in Charged Current Neutrino Interactions
  abstract: The isospin structure of weak single-pion production in the reactions $\nu p\to\mu^-
    p\pi^+$, $\nu n\to\mu^- p\pi^0$, and $\nu n\to\mu^- n\pi^+$ has been studied using the 7-foot
    deuterium bubble chamber exposed to a wide-band neutrino beam at BNL. We find that the
    $I=\tfrac{1}{2}$ $N\pi$ amplitude is substantial even in the $\Delta(1232)$ mass region and
    the relative phase angle $\psi$ is approximately 90° as predicted by the Adler model.
