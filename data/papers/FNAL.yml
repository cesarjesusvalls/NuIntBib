  abstract_tex: We report on a high-statistics bubble-chamber experiment using the Fermilab 15-ft bubble
    chamber filled with a heavy neon/hydrogen mixture exposed to a wide-band neutrino beam. In a sample
    of 106 000 $\nu_\mu$ &>0.3 GeV/c) and a negative muon were observed. After corrections, the rate for
    opposite-sign dilepton production for $\nu_\mu$ charged-current events is (0.52±0.09)%. The Eν dependence
    of this rate from threshold to ≊200 GeV is presented. The kinematic distributions and strange-particle
    content of the dilepton events are consistent with those expected from charm-particle production in
    neutrino interactions. A total of 58 neutral strange particles (Λ $\to$ pπ-, KS0 $\to$ $\pi^+$ $\pi^-$)
    are observed in these events, where less than 16 are expected from conventional charged-current interactions.
    The presence of a significant excess of Λ’s is evidence for substantial charmed-baryon production.
