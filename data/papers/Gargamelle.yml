  abstract: A sample of 766 antineutrino charged current elastic events has been used to extract the variation
    of the elastic cross section with antineutrino energy and the distribution of $dN/dq^2$. The best
    fit value for the parameter $M_A$ obtained from these measurements is $M_A = 0.91\pm0.04$ GeV/$c^2$
    for $M_V = 0.84$ GeV/$c^2$. A simultaneous determination of $M_A$ and $M_V$ gives $M_A = 0.94\pm0.07$,
    $M_V = 0.81$.
