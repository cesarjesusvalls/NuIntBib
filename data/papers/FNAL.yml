  abstract: We report a study of strange-particle production from 61?0 charged-current νμNe interactions
    in the Fermilab 15-ft bubble chamber. The observed sample consists of 2279 K0, 1843 Λ (including 94
    Σ0), 93 Λ¯, and 4 Ξ−. We give inclusive production rates for each of these, as well as the rates for
    specific single-, double-, and triple-vee channels. From these we derive the rates for associated
    production of ss¯ quark pairs, and for single-s-quark production via charm decay. The dependence of
    K0 and Λ production on Eν, Q2, W2, xB, and yB are given. Normalized distributions of Feynman x, rapidity,
    fragmentation variable z, and transverse momentum squared are obtained for K0 and Λ, and compared
    with those for charged pions. QCD predictions on the behavior of 〈PT2〉 are tested.
