  abstract_tex: Charged current reactions of $\nu_e$ on $^{12}\mathrm{C}$ have been studied using a mu
    decay-at-rest $\nu_e$ beam from the Los Alamos Meson Physics Facility. More than 500 events from the
    exclusive reaction $^{12}\mathrm{C}$ + $\nu_e$ $\to$ $e^-$ + $^{12}\mathrm{N}$ g.s. were measured
    in a large Liquid Scintillator Neutrino Detector (LSND). The observed energy dependence of the cross
    section and the angular distribution of the outgoing electron agree well with theoretical expectations.
    Measurements are also presented for inclusive transitions to $^{12}\mathrm{N}$ excited states, $^{12}\mathrm{C}$
    + $\nu_e$ $\to$ $e^-$ + $^{12}\mathrm{N}$ and compared with theoretical expectations. Results are
    consistent with a recent Continuum Random Phase Approximation (CRPA) calculation.
- bibtag: LSND:1997tqo
