  abstract: In an exposure of the Fermilab 15-foot neon-hydrogen bubble chamber to a quadrupole triplet
    neutrino beam, 49μ−e+ and 14μ+e− events with e± momenta greater than 0.3 GeV/c have been observed,
    yielding μe rates per charged-current event of (0.73±0.11)% and (1.1±0.3)%, respectively. The μ−e+
    rate shows no strong energy dependence in the range from 30 to 300 GeV. The 18 neutral strange particles
    observed in the 63 events contain 14KS0, 2Λ, and 2ΛKS0 ambiguities, suggesting that the events are
    predominantly D-meson production and decay and that the Λc+→ΛeX branching ratio is very small. The
    corrected numbers of neutral strange particles per μ−e+ and μ+e− event are 1.2±0.3 and 0.6−0.3+0.6,
    respectively. Properties of the events, including strange-particle production, are compared to μ∓μ±
    events in the same experiment and to a charm production and decay model, and good agreement is found,
    apart from a possible enhancement at ∼5-6 GeV/c2 in the mass of the system recoiling against the μ+
    in μ+e− (and μ+μ−) events. As reported previously, four events show short-lived-particle decays, and
    D-meson lifetime estimates are reevaluated using the final event sample. One μ+e+ and three μ−e− events
    were observed. The μ−e− events are consistent with background and lead to a μ−e−μ−e+ ratio of less
    than 0.07 (90% confidence level) for e± momenta above 0.8 GeV/c. Five candidates for dilepton production
    by electron neutrinos and antineutrinos in the beam are consistent with approximately 1% rates. No
    good three-lepton candidates were found, and one, previously reported, four-lepton candidate was found.
