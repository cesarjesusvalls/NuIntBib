  abstract_tex: We report an improved measurement of the inverse muon decay process, $\nu_\mu$ +e $\to$
    $\mu^-$ + $\nu_e$ , at the Fermilab Tevatron. The rate of this reaction with respect to the $\nu_\mu$
    -N charged current interaction is measured to be (0.1245±0.0057(stat.)±0.0031 (sys.)) $\times 10^{-2}$
    . The measurement confirms the standard model predictions for the Lorentz structure of the weak current,
    the helicity of the neutrino, and the energy dependence of the cross section.
- bibtag: Foudas:1989rk
  title: Neutrino Production of Opposite Sign Dimuons at Tevatron Energies
  collaboration: CCFR
  arxiv: null
  doi: 10.1103/PhysRevLett.64.1207
  journal: Phys.Rev.Lett.
  volume: '64'
  pages: '1207'
  year: 1989
  published_date: '1989-10-02'
  inspire_recid: 26417
  citation_count: 156
  abstract: We have measured the strange-quark content of the nucleon, ηs=−0.08+0.012, and the Kobayashi-Maskawa
    matrix element ‖Vcd‖=0.220−0.018+0.015 using a sample of 1797 νμ- and ν¯μ-induced μ−μ+ events with
    Pμ≥9 GeV/c and 30≤Eν≤600 GeV. The data are consistent with the slow-rescaling hypothesis of charm
    production in ν-N scattering and within this formalism yield a value of the charm-quark mass parameter
    mc=1.31−0.48+0.64 GeV/c2. .AE
