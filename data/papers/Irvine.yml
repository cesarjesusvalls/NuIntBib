    observables: ν̄e e→ν̄e e elastic cross section (reactor)
    energy_notes: Savannah River reactor ν̄e (few MeV)
    flavor_note: CC–NC interference
  abstract_tex: The reaction $\bar\nu_e$+$e^-$ $\to$ $\bar\nu_e$+$e^-$ has been observed using a 15.9-kg
    plastic scintillation target in a composite plastic-NaI-liquid detector exposed to a $\bar\nu_e$ flux
    of 2.2$\times 10^{13}$ cm-2 sec-1 from an 1800-MW fission reactor. Tests rule out a reactor-associated
    signal produced by inverse β decay, neutrons, or gamma rays. The measured cross section is consistent
    with V-A and the Weinberg model with parameter sin2θW=0.29±0.05.
