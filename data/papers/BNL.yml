- bibtag: Baker:1982ty
  title: Total Cross-sections for Muon-neutrino $N$ and Muon-neutrino $P$ Charged Current Interactions in the 7-ft
    Bubble Chamber
  collaboration: BNL
  arxiv: null
  doi: 10.1103/PhysRevD.25.617
  journal: Phys.Rev.D
  volume: '25'
  pages: '617'
  year: 1982
  published_date: '1982'
  inspire_recid: 177607
  citation_count: 136
  abstract: The total cross sections for νμn and νμp charged-current interactions and their ratio R=σT(νn)σT(νp)
    have been measured as a function of neutrino energy from 0.4 to 10 GeV. The experiment is performed using the
    BNL 7-foot deuterium bubble chamber exposed to the Alternating Gradient Synchrotron wide-band neutrino beam.
    The absolute values of the cross sections are normalized to the quasielastic scattering (νμn→μ−p) cross section.
    Above 1.6 GeV the data are consistent with the quark-parton model. We find that σT(νn)Eν=(1.07±0.05)×10−38,
    σT(νp)Eν=(0.54±0.04)×10−38, and σT(νN)Eν=(0.80±0.03)×10−38 cm2/GeV for 〈Eν〉=3.2 GeV, and R=1.95±0.10 for 〈Eν〉=3.7
    GeV.
  added: '2026-07-23'
  notes: Added after cross-referencing the Formaggio-Zeller review (1305.7513) and the Wilkinson ANL/BNL reanalysis
    (1411.4482).
