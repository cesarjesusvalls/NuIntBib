- bibtag: Bonetti:1977cs
  title: Study of Quasielastic Reactions of Neutrino and anti-neutrino in Gargamelle
  collaboration: Gargamelle
  arxiv: null
  doi: 10.1007/BF02730023
  journal: Nuovo Cim.A
  volume: '38'
  pages: '260'
  year: 1977
  published_date: '1977'
  inspire_recid: 124163
  citation_count: 148
  abstract: The quasi-elastic cross-sections $\sigma_\mathrm{el}^\mathrm{tot}$ and $d\sigma/dq^2$ for
    the reactions 1) $\nu n \to \mu^- p$ and 2) $\bar\nu p \to \mu^+ n$ have been measured by using the
    data of the $\nu$ Gargamelle collaboration. 687 $\nu$ events, candidates for reaction 1), and 476
    $\bar\nu$ events, candidates for reaction 2), have been used for the analysis. Because the $\nu$ and
    $\bar\nu$ interactions are on nuclei, suitable corrections for nuclear effects have been taken into
    account. In the framework of the usual $V-A$ theory, by assuming for the axial form factor the dipole
    form $F_A(q^2) = 1.23/(1 + q^2/M_A^2)^2$, our data have been fitted to the differential cross-section
    $d\sigma/dq^2$ integrated over the $\nu$ and $\bar\nu$ energy spectra and to the total cross-section
    $\sigma_\mathrm{el}^\mathrm{tot}$ as a function of the $\nu$, $\bar\nu$ energy to determine the best
    value for the parameter $M_A$.
  added: '2026-06-16'
