- bibtag: LSND:2001fbw
  title: Measurements of charged current reactions of nu(e) on 12-C
  collaboration: LSND
  arxiv: hep-ex/0105068
  doi: 10.1103/PhysRevC.64.065501
  journal: Phys.Rev.C
  volume: '64'
  pages: '065501'
  year: 2001
  published_date: 2001-05
  inspire_recid: 557014
  citation_count: 139
  release_status: abstract
  abstract: Charged Current reactions of $\nu_e$ on $^{12}C$ have been studied using a $\mu^+$ decay-at-rest
    $\nu_e$ beam at the Los Alamos Neutron Science Center. The cross section for the exclusive reaction
    $^{12}C(\nu_e,e^-)^{12}N_{g.s.}$ was measured to be $(8.9\pm0.3\pm0.9)\times10^{-42}$ cm$^2$. The
    observed energy dependence of the cross section and angular distribution of the outgoing electron
    agree well with theoretical expectations. Measurements are also presented for inclusive transitions
    to $^{12}N$ excited states, $^{12}C(\nu_e,e^-)^{12}N^*$ and compared with theoretical expectations.
    The measured cross section, $(4.3\pm0.4\pm0.6)\times10^{-42}$ cm$^2$, is somewhat lower than previous
    measurements and than a continuum random phase approximation calculation. It is in better agreement
    with a recent shell model calculation.
  added: '2026-08-07'
