- bibtag: Aachen-Bonn-CERN-Democritos-London-Oxford-Saclay:1982tho
  title: Strange Particle Production in Neutrino and Anti-neutrino Neon Interactions
  collaboration: BEBC
  arxiv: null
  doi: 10.1016/0550-3213(82)90100-6
  journal: Nucl.Phys.B
  volume: '209'
  pages: '29'
  year: 1982
  published_date: 1982-11
  inspire_recid: 12781
  citation_count: 49
  abstract: The inclusive production of K 0 's and Λ's has been investigated in neutrino and antineutrino
    interactions in BEBC, filled with a neon-hydrogen mixture. The inclusive rates for the 3083 (1022)
    ν ( ν ) induced charged current events are (23.0 ± 1.7)% ((21.9 ± 2.8)%) for K 0 's and (5.7 ± 0.7)%
    ((6.5 ± 1.2)%) for Λ 's. The general behaviour of the K 0 's and Λ's is found to be similar to that
    in νp interactions and π + p interactions at lower 〈 W 〉. In the hadronic c.m.s. K 0 's are produced
    mostly forwards, Λ's predominantly in the backward hemisphere. The data indicate that K 0 's produced
    in ν interactions on average carry a larger fraction of the total available momentum than those in
    ν induced reactions. The dependences of the average transverse momentum on the variables Q 2 , W 2
    and Bjorken x are presented.
