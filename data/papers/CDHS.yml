  abstract: A large sample of opposite-sign dimuons, produced by the interaction of neutrinos and antineutrinos
    in iron, is analysed. The data agree very well with the hypothesis that the extra muon is the product
    of charm decay. They yield information on the strength and space-time structure of the charmproducing
    weak current. The strange-sea structure functionxs(x) is determined. The difference between neutrino
    and antineutrino dimuon production is analysed to provide a value of the Kobayashi-Maskawa weak mixing
    angleθ2.
